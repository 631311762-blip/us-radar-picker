name: A股模型统一流水线（共同前置层）

# =========================================================================
# 合并流水线：把 5 个 A 股模型 + 4 个共同条件收口到单 runner 顺序执行。
# 共同前置层（common/prefilter.py）只跑一次，产出：
#   ① 全市场行情记录（K线缓存）  ② 立信审计排除集  ③ ST/退市硬剔除样本池
#   ④ 交易日判定
# 下游模型从这一份样本池 + K线缓存出发，各自套自己的选股逻辑，不再各自
# 拉全市场（提速，并彻底规避独立 job 全市场扫描超时）。
# 模型跑完由 common/run_all.py 统一做「回溯推荐 + 参数修正」（条件④）。
#
# 注册表 common/registry.json：新增模型只要在此加一项即自动套用四个共同条件，
# 无需改本 workflow。
#
# 2026-11-10：主升浪 V4（stock-v3/daily_v3.py）已登记进 registry.json，
# 由本流水线同一 runner、同一 cron（15:10）顺序跑，并纳入统一结论表
# run_summary.json；其独立定时 workflow（stock-v3-daily.yml）已取消 schedule、
# 仅保留手动触发兜底，不再单独自动运行。
# =========================================================================

on:
  # 正式切换后启用定时：UTC 07:10 = 北京时间 15:10（周一~五，A 股收盘后）。
  # 已停用 5 个被本流水线取代的独立 A 股 workflow
  #（shanshui/low_shadow/lingpei/kaizhong/yidian），避免重复运行。
  # 美股 us-radar-picker.yml 仍保持独立运行（不同市场，不共享前置层）。
  # 主升浪 V4 已于 2026-11-10 并入本流水线（见 registry.json 的 zhushanglang 项）。
  # 【重要】本 schedule 必须经「git push 到 main」才会被 GitHub 注册/重新同步；
  # 仅用 API 构造 commit 不会激活定时（GitHub schedule 依赖 push 事件 resync）。
  # 若某日发现未自动触发，先用 `gh` 或 git push 一次本文件即可恢复。
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      f10_only:
        description: "立信仅查 F10（完全跳过 26 年公告扫描，加速验证）"
        required: false
        default: "false"
      ann_full:
        description: "立信 B 通道跑 2026 全年基线（默认按日期增量扫描，约 30 秒）"
        required: false
        default: "false"
      only_model:
        description: "只跑指定模型（逗号分隔，如 yidian,shanshui）；留空跑全部"
        required: false
        default: ""
      no_kline:
        description: "跳过全市场 K 线批量缓存（调试）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: a-share-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（全模型合并）
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet requests numpy pandas

      - name: 共同前置层（交易日 + 立信 + ST + 全市场行情记录）
        id: prefilter
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          # 2026-11-13：抓取时间预算改为仓库变量可配置
          # （Settings → Secrets and variables → Actions → Variables），
          # 缺省仍为 300s，无需改代码即可按运行状况调整。
          KLINE_BATCH_BUDGET: ${{ vars.KLINE_BATCH_BUDGET || '300' }}
          LIST_FETCH_DEADLINE: ${{ vars.LIST_FETCH_DEADLINE || '300' }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ github.event.inputs.f10_only }}" = "true" ]; then ARGS="$ARGS --f10-only"; fi
          if [ "${{ github.event.inputs.ann_full }}" = "true" ]; then ARGS="$ARGS --ann-full"; fi
          if [ "${{ github.event.inputs.no_kline }}" = "true" ]; then ARGS="$ARGS --no-kline"; fi
          python3 common/prefilter.py $ARGS
          # 输出 trading_day 供后续步骤判断
          TD=$(python3 -c "import json;print('true' if json.load(open('common/state/meta.json')).get('trading_day') else 'false')")
          echo "trading_day=$TD" >> "$GITHUB_OUTPUT"

      # 2026-11-13：前置层可观测性 —— 把降级模式、K线覆盖率、快照健康、
      # 告警清单写进 Step Summary，避免「静默用残缺数据」无人察觉。
      - name: 前置层运行摘要（降级 / 覆盖率 / 告警）
        if: always()
        id: prefilter_report
        run: |
          python3 - <<'PY'
          import json, os
          m = {}
          try:
              m = json.load(open("common/state/meta.json", encoding="utf-8"))
          except Exception as e:
              print("meta.json 不可读（前置层可能未产出）: %s" % e)
          degraded = bool(m.get("degraded"))
          alerts = m.get("alerts") or []
          k = m.get("kline") or {}
          kz = m.get("kz_kline") or {}
          sh = m.get("snapshot_health") or {}
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write("degraded=%s\n" % ("true" if degraded else "false"))
          lines = [
              "### 共同前置层运行摘要", "",
              "- 样本池：%s 只，来源：%s" % (m.get("universe_count", "-"), m.get("universe_source", "-")),
              "- 降级模式：%s" % ("是" if degraded else "否"),
              "- 快照健康：%s（%s 只）%s" % (
                  sh.get("ok", "-"), sh.get("rows", "-"),
                  "" if sh.get("ok") else " / " + str(sh.get("reason", ""))),
          ]
          if k and not k.get("skipped"):
              lines.append("- 共享K线覆盖率：%.1f%%（成功 %s / 需拉 %s，失败 %s，超预算跳过 %s）" % (
                  k.get("coverage", 0) * 100, k.get("ok", "-"), k.get("targets", "-"),
                  k.get("fail", "-"), k.get("skip", "-")))
          if kz:
              lines.append("- 凯众K线覆盖率：%.1f%%（成功 %s / 需预填 %s）" % (
                  kz.get("coverage", 0) * 100, kz.get("ok", "-"), kz.get("targets", "-")))
          if alerts:
              lines += ["", "#### 本次告警"]
              for a in alerts:
                  lines.append("- **%s**：%s" % (
                      a.get("title", ""), str(a.get("content", "")).replace("\n", " ")))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: 失败摘要（配合按天聚合通知）
        if: failure()
        run: |
          echo "### 本次运行失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "失败详情已由 failure-notify.yml 按天聚合成一条告警，当日后续失败不再重复推送。" >> "$GITHUB_STEP_SUMMARY"

      - name: 运行全部模型（共同样本池 + 统一回溯/修正）
        if: steps.prefilter.outputs.trading_day == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FTQQ_KEY: ${{ secrets.FTQQ_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          STATE_DIR: ${{ github.workspace }}/state
        run: |
          ONLY="${{ github.event.inputs.only_model }}"
          if [ -n "$ONLY" ]; then
            python3 common/run_all.py --only "$ONLY"
          else
            python3 common/run_all.py
          fi

      - name: 回写状态（立信集 / 推荐台账 / 回溯 / 参数 / 基础股票池快照）
        if: always()
        run: |
          git config user.name "a-share-bot"
          git config user.email "a-share-bot@users.noreply.github.com"
          # K线缓存 / universe.json 为当日临时产物，不入库（见 .gitignore）
          git add common/state/lingpei*_lixin* 2>/dev/null || true
          git add common/state/lixin_exclude.json 2>/dev/null || true
          git add common/state/recommendations 2>/dev/null || true
          git add common/state/reviews 2>/dev/null || true
          git add common/state/params 2>/dev/null || true
          git add common/state/run_summary.json 2>/dev/null || true
          git add common/state/universe.json 2>/dev/null || true  # 合并流水线样本池（供云盘自动化筛选；gitignored 实际不入库）
          # 基础股票池快照：实时列表接口失效时的兜底，必须入库以跨 runner 持久化
          git add common/state/base_universe.json 2>/dev/null || true
          # 各模型自有台账/归档
          git add shanshui/善水模型_推荐跟踪.csv 2>/dev/null || true
          git add lingpei/state 2>/dev/null || true
          # 领湃台账与「按天推送去重标记」实际落在 lingpei/lingpei/state，
          # 需一并回写才能跨 runner 生效（防止兜底/补跑当天重复推送）。
          git add lingpei/lingpei/state 2>/dev/null || true
          git add yidian/state 2>/dev/null || true
          git add kaizhong/state 2>/dev/null || true
          git add low_shadow/state 2>/dev/null || true
          git add powei/state 2>/dev/null || true
          # 主升浪子系统（kline_cache*.json 已在 .gitignore，不会入库）
          git add stock-v3/ 2>/dev/null || true
          git commit -m "a-share pipeline state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
