name: 领湃模型每日流程

on:
  schedule:
    # UTC 08:35 = 北京时间 16:35，周一至周五收盘后
    - cron: "35 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingpei
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: lingpei
        run: pip install -r requirements.txt

      - name: 运行领湃三步流程
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: lingpei/state
        working-directory: lingpei
        run: |
          mkdir -p state
          python3 _lixin_update.py && python3 领湃模型_每日.py && python3 领湃跟踪修正.py

      - name: 回写状态（供次日复盘）
        if: always()
        run: |
          git config user.name "lingpei-bot"
          git config user.email "lingpei-bot@users.noreply.github.com"
          git add lingpei
          git commit -m "lingpei state: $(date -u +%F)" || echo "无状态变更"
          git push || echo "推送状态失败（不影响选股）"
