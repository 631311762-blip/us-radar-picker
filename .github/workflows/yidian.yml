name: 易点模型每日流程

# =========================================================================
# 2026-11-13 收敛说明（用户要求 2 / 3）
# -------------------------------------------------------------------------
# 易点已登记在 common/registry.json，由统一流水线 a-share-pipeline.yml
# 于北京 16:05 每日自动执行。原独立 schedule（北京 16:45）会让易点同一天
# 跑两遍；原 push 触发会在改动 yidian/ 时再叠一次。两者均已取消。
#
# 仅保留 workflow_dispatch：手动调试 + 供 fallback-2300.yml（北京 23:00）
# 在主流水线当日失败时调用，按自身代码独立产出。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yidian
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 兜底路径无共享 K 线缓存，需自行抓取全市场，放宽预算
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: yidian
        run: pip install -r requirements.txt

      - name: 运行易点模型选股（自身代码路径）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: yidian/state
          # 时区固定，日志与计时更易读（脚本内部已按北京时间计日，双重保险）
          TZ: Asia/Shanghai
        run: |
          mkdir -p yidian/state/archive
          python3 yidian/run.py

      - name: 回写状态与归档（供次日复盘）
        if: always()
        run: |
          git config user.name "yidian-bot"
          git config user.email "yidian-bot@users.noreply.github.com"
          git add yidian/state
          git commit -m "yidian state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
