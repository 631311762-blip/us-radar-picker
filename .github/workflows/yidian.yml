name: 易点模型每日流程（已停用）

# =========================================================================
# 2026-11-23 停用说明（用户决定）
# -------------------------------------------------------------------------
# 易点模型 2026 年回溯 T+3/T+5 胜率仅 46.6%/44.8%、收益 -0.18%/-0.30%，
# 用户决定停止推送更新，已被怡达模型替换。
#   - common/registry.json 中 yidian 的 enabled 已设 false → 统一流水线不再调度；
#   - fallback-2300.yml 兜底派发列表已移除 yidian.yml；
#   - failure-notify.yml 监控列表已移除本流程。
# 本文件保留 workflow_dispatch 仅供手动调试/补跑，不会被任何定时任务触发。
# 如需恢复：把 registry.json 的 yidian.enabled 设回 true，并恢复上述两处引用。
# =========================================================================

# =========================================================================
# 2026-11-13 收敛说明（用户要求 2 / 3）
# -------------------------------------------------------------------------
# 易点已登记在 common/registry.json，由统一流水线 a-share-pipeline.yml
# 于北京 16:05 每日自动执行。原独立 schedule（北京 16:45）会让易点同一天
# 跑两遍；原 push 触发会在改动 yidian/ 时再叠一次。两者均已取消。
#
# 仅保留 workflow_dispatch：手动调试 + 供 fallback-2300.yml（北京 23:00）
# 在主流水线当日失败时调用，按自身代码独立产出。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yidian
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 兜底路径无共享 K 线缓存，需自行抓取全市场，放宽预算
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # 2026-11-25：本流程虽已停用，但旧版 watchdog 的派发名单仍含 yidian.yml，
      # 被误派发时 run.py 会照常抓数并推送（11-25 即因此收到「数据源异常告警」）。
      # 这里以 registry.enabled 为唯一开关：false 时整条流程直接空跑，不抓数、不推送。
      - name: 停用校验（registry.enabled=false 则跳过）
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          ms = [m for m in json.load(open('common/registry.json'))['models']
                if m['name'] == 'yidian']
          print('run=%s' % ('false' if ms and not ms[0].get('enabled') else 'true'))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: yidian
        run: pip install -r requirements.txt

      - name: 运行易点模型选股（自身代码路径）
        if: steps.guard.outputs.run == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: yidian/state
          # 时区固定，日志与计时更易读（脚本内部已按北京时间计日，双重保险）
          TZ: Asia/Shanghai
        run: |
          mkdir -p yidian/state/archive
          python3 yidian/run.py

      - name: 回写状态与归档（供次日复盘）
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "yidian-bot"
          git config user.email "yidian-bot@users.noreply.github.com"
          git add yidian/state
          git commit -m "yidian state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
