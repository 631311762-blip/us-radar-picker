name: 凯众模型 v4 每日流程

# =========================================================================
# 2026-11-13 收敛说明（用户要求 2 / 3）
# -------------------------------------------------------------------------
# 凯众已登记在 common/registry.json，由统一流水线 a-share-pipeline.yml
# 于北京 16:05 在共享前置层内每日自动执行。本 workflow 不再保留任何独立
# 自动触发（原 push 触发会在改动 kaizhong/ 时与流水线重复跑一遍）。
#
# 仅保留 workflow_dispatch，用途：
#   1) 手动调试；
#   2) 被 fallback-2300.yml（北京 23:00 兜底）在主流水线当日失败时调用，
#      按本文件「自身运行代码」独立产出，不依赖统一流水线的调度。
# 兜底采用串行 dispatch；回写带 [skip ci] + pull --rebase，不产生循环/冲突。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kaizhong
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 兜底路径无共享 K 线缓存，需自行抓取全市场，放宽预算
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: kaizhong
        run: pip install -r requirements.txt

      - name: 运行凯众 v4 模型（自身代码路径）
        env:
          FTQQ_KEY: ${{ secrets.FTQQ_KEY }}
          # 仓库实际只配置了 SERVERCHAN_SENDKEY（无 FTQQ_KEY），必须一并透传，
          # 否则模型日志会「未配置 SENDKEY，跳过推送」，微信收不到。
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 【必须绝对路径】working-directory 已是 kaizhong/，若写相对路径 kaizhong/state
          # 会被 lib.py 的 abspath 拼成 kaizhong/kaizhong/state，
          # 导致读不到已入库的历史台账（表现为「台账共 6 笔」而非 400+ 笔）。
          KZ_DATA_DIR: ${{ github.workspace }}/kaizhong/state
          KZ_TOP: "6"
          TZ: Asia/Shanghai
        working-directory: kaizhong
        run: |
          mkdir -p state/reports
          python3 daily_v4.py

      - name: 回写状态与台账（供次日复盘 / 跨市场匹配）
        if: always()
        run: |
          git config user.name "kaizhong-bot"
          git config user.email "kaizhong-bot@users.noreply.github.com"
          git add kaizhong/state
          git commit -m "kaizhong state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
