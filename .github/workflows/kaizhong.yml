name: 凯众模型 v4 每日流程

on:
  # 2026-11-10：已并入 a-share-pipeline（同一 cron 16:05、共享前置层），
  # 本 workflow 取消 schedule，仅保留手动触发兜底，避免同日重复运行/重复推送。
  workflow_dispatch:
  push:
    # 只要 kaizhong/ 下的脚本或本 workflow 有改动，就自动跑一遍验证
    paths:
      - "kaizhong/**"
      - ".github/workflows/kaizhong.yml"

permissions:
  contents: write

concurrency:
  group: kaizhong
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: kaizhong
        run: pip install -r requirements.txt

      - name: 运行凯众 v4 模型
        env:
          FTQQ_KEY: ${{ secrets.FTQQ_KEY }}
          # 仓库实际只配置了 SERVERCHAN_SENDKEY（无 FTQQ_KEY），必须一并透传，
          # 否则模型日志会「未配置 SENDKEY，跳过推送」，微信收不到。
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          # 【必须绝对路径】working-directory 已是 kaizhong/，若写相对路径 kaizhong/state
          # 会被 lib.py 的 abspath 拼成 kaizhong/kaizhong/state，
          # 导致读不到已入库的历史台账（表现为「台账共 6 笔」而非 400+ 笔）。
          KZ_DATA_DIR: ${{ github.workspace }}/kaizhong/state
          KZ_TOP: "6"
        working-directory: kaizhong
        run: |
          mkdir -p state/reports
          python3 daily_v4.py

      - name: 回写状态与台账（供次日复盘 / 跨市场匹配）
        if: always()
        run: |
          git config user.name "kaizhong-bot"
          git config user.email "kaizhong-bot@users.noreply.github.com"
          git add kaizhong/state
          git commit -m "kaizhong state: $(date -u +%F)" || echo "无状态变更"
          git push || echo "推送状态失败（不影响选股）"
