name: A股模型 23点独立兜底

# =========================================================================
# 2026-11-13 新增（用户要求 3）
# -------------------------------------------------------------------------
# 目标：合并流水线（北京 15:10）当日没成功时，23:00 让各模型按「自身运行
#       代码」独立产出；流水线成功则整条跳过，绝不重复运行。
#
# 判断依据：查统一流水线 workflow(412216318) 的运行记录
#   - 近 18 小时内有 conclusion=success  -> skip（结果已出）
#   - in_progress / queued 在途且 <90min -> skip（只是延迟，避免双跑）
#   - in_progress 在途超 90min           -> dispatch（判定卡死，强制兜底）
#   - 其余（失败 / 取消 / 漏跑）         -> dispatch 各模型独立流程
#   - 查询 API 异常                      -> dispatch（产出优先，宁重勿漏）
#
# 【2026-11-25 修复：按模型判断，不再用领湃代表全部模型】
#   11-25 主流水线失败后，watchdog 已拉起部分独立流程（领湃 18:28 推送成功），
#   但旧逻辑只看「领湃是否推送」，于是把整条兜底 skip 掉，导致主升浪当天
#   完全没补推。现在改为逐个模型检查各自的产出标记，只补跑「未产出且不在途」
#   的模型；每个模型都有自己的推送去重，重复派发也不会重复推送。
#
# 为什么用「近 18 小时」而不是「当天日期」：
#   GitHub 的 schedule 实测会延迟约 1 小时，23:00 的点火可能落到次日 00:xx
#   （北京时间），按日期比对会把「昨天已成功」误判成「今天没跑」而重复跑。
#   主流水线 cron 在 UTC 07:10、watchdog 补跑在 UTC 09:20，18h 窗口足以
#   覆盖两者，又不会把前一天的成功算进来。
#
# 防循环 / 防重复：
#   - 被拉起的各 workflow 全部只保留 workflow_dispatch，不带 schedule/push；
#   - GITHUB_TOKEN 触发的 dispatch 不会再触发本工作流；
#   - 串行 dispatch + 间隔，降低瞬时并发对行情网关的冲击；
#   - concurrency 保证同一时刻只有一个兜底实例。
# =========================================================================

on:
  schedule:
    # UTC 15:00 = 北京时间 23:00，周一~周五
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略主流水线成功状态，强制拉起全部模型（调试用）'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: fallback-2300
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      wfs: ${{ steps.decide.outputs.wfs }}
      reason: ${{ steps.decide.outputs.reason }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - name: 判断当日各模型是否已产出（按模型逐个判断）
        id: decide
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, datetime

          repo = os.environ['REPO']
          tok = os.environ['GH_TOKEN']
          force = str(os.environ.get('FORCE', 'false')).lower() == 'true'
          now = datetime.datetime.now(datetime.timezone.utc)
          today_utc = now.strftime('%Y-%m-%d')
          today_bjt = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d')
          window = datetime.timedelta(hours=18)
          wf_id = '412216318'   # A股模型统一流水线（共同前置层）

          # 只跑 registry 里 enabled 的模型：2026-11-23 起 shanshui/yidian 已停用，
          # 2026-11-25 从兜底名单移除，避免把停用模型的旧流程拉起来。
          WFS = ['lingpei.yml', 'low_shadow2.yml', 'kaizhong.yml',
                 'yida.yml', 'powei.yml', 'stock-v3-daily.yml']

          def gh(path):
              req = urllib.request.Request(
                  'https://api.github.com/repos/%s/%s' % (repo, path),
                  headers={'Authorization': 'Bearer ' + tok,
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'fallback-2300'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)

          def raw(path):
              req = urllib.request.Request(
                  'https://raw.githubusercontent.com/%s/main/%s' % (repo, path),
                  headers={'Authorization': 'Bearer ' + tok,
                           'User-Agent': 'fallback-2300'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode('utf-8', 'replace')

          def pushed_today(wf):
              """该模型今天是否真的产出了（读各自 workflow 回写的那份标记文件）。"""
              try:
                  if wf == 'lingpei.yml':
                      return today_bjt in raw('lingpei/lingpei/state/领湃_推送去重.json')
                  if wf == 'stock-v3-daily.yml':
                      for line in reversed(raw('stock-v3/push_log.jsonl').splitlines()[-80:]):
                          try:
                              rec = json.loads(line)
                          except Exception:
                              continue
                          if rec.get('ok') and rec.get('date') == today_bjt:
                              return True
                      return False
                  if wf == 'powei.yml':
                      return ('"date": "%s"' % today_bjt) in raw('powei/state/index.jsonl')
                  if wf == 'yida.yml':
                      return raw('common/state/recommendations/yida/%s.json'
                                 % today_bjt) is not None
                  if wf == 'low_shadow2.yml':
                      return raw('common/state/recommendations/low_shadow2/%s.json'
                                 % today_bjt) is not None
                  if wf == 'kaizhong.yml':
                      items = gh('contents/kaizhong/state/reports?ref=main')
                      return any(today_bjt in it.get('name', '') for it in items)
              except Exception as e:
                  print('WARN 读 %s 产出标记失败(%s)，按未产出处理' % (wf, e))
              return False

          def active_today(wf):
              """今天是否已有该 workflow 在跑/排队，避免重复派发。"""
              try:
                  for r in gh('actions/workflows/%s/runs?per_page=16' % wf)['workflow_runs']:
                      if r['created_at'][:10] == today_utc and r['status'] in (
                              'in_progress', 'queued', 'pending', 'requested'):
                          return True
              except Exception as e:
                  print('WARN 查 %s 运行状态失败(%s)' % (wf, e))
              return False

          has_success, has_running, stuck_run = False, False, None
          reason, api_err = '', None
          try:
              runs = gh('actions/workflows/%s/runs?per_page=100' % wf_id)['workflow_runs']
              STALE_MINUTES = 90
              for r in runs:
                  created = datetime.datetime.fromisoformat(
                      r['created_at'].replace('Z', '+00:00'))
                  age = now - created
                  st, con = r['status'], r.get('conclusion')
                  if st in ('in_progress', 'queued', 'pending', 'requested'):
                      has_running = True
                      age_min = age.total_seconds() / 60
                      print('在途: run %s %s @ %s（已 %.0f 分钟）'
                            % (r['id'], st, r['created_at'], age_min))
                      if age_min > STALE_MINUTES:
                          stuck_run = r['id']
                          print('[WARN] 主流水线 run %s 在途超 %d 分钟，判定卡死'
                                % (r['id'], STALE_MINUTES))
                      continue
                  if st == 'completed' and con == 'success' and datetime.timedelta(0) <= age <= window:
                      has_success = True
                      print('近18h已成功: run %s @ %s' % (r['id'], r['created_at']))
                      break
          except Exception as e:
              api_err = str(e)
              print('WARN 查询主流水线状态异常: %s' % e)

          missing = [wf for wf in WFS if not pushed_today(wf) and not active_today(wf)]
          print('未产出模型: %s' % (' '.join(missing) or '无'))

          if force:
              targets, decision, reason = WFS, 'dispatch', '手动 force=true 强制兜底'
          elif has_success:
              targets, decision, reason = [], 'skip', '主流水线近18h已成功'
          elif not missing:
              targets, decision, reason = [], 'skip', '各模型今日均已产出或在途'
          elif has_running:
              targets, decision, reason = [], 'skip', '主流水线仍在途（未超时），避免双跑'
          else:
              targets, decision = missing, 'dispatch'
              if api_err:
                  reason = '查询主流水线失败(%s)，产出优先故补跑未产出模型' % api_err
              elif stuck_run is not None:
                  reason = '主流水线 run %s 卡死，补跑未产出模型' % stuck_run
              else:
                  reason = '主流水线当日失败/取消/漏跑，补跑未产出模型'

          print('DECISION=%s TARGETS=%s REASON=%s'
                % (decision, ' '.join(targets) or '-', reason))
          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a', encoding='utf-8') as fh:
                  fh.write('decision=%s\n' % decision)
                  fh.write('wfs=%s\n' % ' '.join(targets))
                  fh.write('reason=%s\n' % reason)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('## 23点兜底判定\n\n- 结论：`%s`\n- 补跑模型：`%s`\n- 原因：%s\n'
                           '- 判定时刻(UTC)：%s\n'
                           % (decision, ' '.join(targets) or '-', reason,
                              now.strftime('%Y-%m-%d %H:%M:%S')))
          PY

  fallback:
    needs: check
    if: needs.check.outputs.decision == 'dispatch' && needs.check.outputs.wfs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      REASON: ${{ needs.check.outputs.reason }}
      TARGETS: ${{ needs.check.outputs.wfs }}
    steps:
      - name: 串行拉起未产出模型的独立流程
        run: |
          set -u
          echo "兜底触发原因：$REASON"
          echo "补跑模型：$TARGETS"
          # 与 common/registry.json 中 enabled 的模型对应（2026-11-23 起易点/善水停用）
          OK=0; FAIL=0
          for wf in $TARGETS; do
            echo "---- dispatch $wf ----"
            if gh api -X POST "repos/$REPO/actions/workflows/$wf/dispatches" -f ref=main; then
              echo "OK   $wf"; OK=$((OK+1))
            else
              echo "FAIL $wf（可能文件尚未同步到 main）"; FAIL=$((FAIL+1))
            fi
            sleep 15
          done
          echo "兜底派发完成：成功 $OK，失败 $FAIL"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## 23点兜底派发结果"
              echo ""
              echo "- 触发原因：$REASON"
              echo "- 补跑模型：\`$TARGETS\`"
              echo "- 成功派发：$OK 个"
              echo "- 派发失败：$FAIL 个"
              echo "- 说明：各模型按自身运行代码独立产出，互不阻塞；"
              echo "  详情请到 Actions 页查看对应工作流。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # 全部失败才标红，部分失败不阻断（其余模型仍已产出）
          if [ "$OK" -eq 0 ]; then
            echo "::error::补跑模型全部派发失败，请检查 workflow 文件与 GITHUB_TOKEN 权限"
            exit 1
          fi
