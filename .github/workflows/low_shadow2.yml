name: 低位上影模型2 独立流程

# =========================================================================
# 2026-11-13 新增（用户要求 1 / 3）
# -------------------------------------------------------------------------
# low_shadow2 与 low_shadow 是两个独立模型，都登记在 common/registry.json，
# 平日由统一流水线（北京 16:05）执行。本文件只作「自身代码」兜底路径，
# 供 fallback-2300.yml 在主流水线当日失败时调用，不带任何独立定时。
#
# 为什么必须带共同前置层：low_shadow2_screener.py 通过 common/adapter.py
# 的 adapter.install() 强制把 get_universe/kline 切到共享层；若没有前置层
# 产物，会回退到 akshare 逐只抓 4600+ 只（极慢）且「仅打印不写台账」。
# 共享 K 线缓存 common/state/klines/ 被 .gitignore 排除、跨 runner 不存在，
# 所以这里必须在本 runner 内跑一次 prefilter.py 自己生成。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: low_shadow2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python3 -m pip install --quiet requests numpy pandas

      - name: 共同前置层（交易日 + 立信 + ST + 全市场行情记录）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          KLINE_BATCH_BUDGET: ${{ vars.KLINE_BATCH_BUDGET || '300' }}
          LIST_FETCH_DEADLINE: ${{ vars.LIST_FETCH_DEADLINE || '300' }}
        run: python3 common/prefilter.py

      - name: 运行低位上影模型2（自身代码路径）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 low_shadow2/low_shadow2_screener.py --mode review

      - name: 回写状态与推荐台账
        if: always()
        run: |
          git config user.name "low_shadow2-bot"
          git config user.email "low_shadow2-bot@users.noreply.github.com"
          git add common/state/recommendations/low_shadow2 2>/dev/null || true
          git add common/state/universe.json 2>/dev/null || true
          git commit -m "low_shadow2 state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
