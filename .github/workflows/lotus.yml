name: 莲花模型每日流程

# =========================================================================
# 2026-11-28 新增：莲花模型（lotus）独立 workflow。
# 与其他模型（yida/kaizhong/low_shadow 等）一致：
#   · 每日自动执行由统一流水线 a-share-pipeline.yml（北京 15:10）负责，
#     莲花已登记在 common/registry.json，由 run_all.py 顺序调度。
#   · 本 workflow 仅保留 workflow_dispatch，用途：
#       1) 手动调试；
#       2) 被 fallback-2300.yml / watchdog.yml 在主流水线当日失败时兜底调用。
# 独立 concurrency group=lotus，不受主流水线 group 锁约束。
# 回写带 [skip ci] + pull --rebase，不产生循环/冲突。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lotus
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python3 -m pip install --quiet requests numpy pandas

      - name: 运行莲花模型（自身代码路径）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python3 lotus/daily_lotus.py

      - name: 回写台账（供次日复盘/统一回溯）
        if: always()
        run: |
          git config user.name "lotus-bot"
          git config user.email "lotus-bot@users.noreply.github.com"
          git add lotus/state common/state/recommendations/lotus common/state/review/lotus common/state/params/lotus.json 2>/dev/null || true
          git commit -m "lotus state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
