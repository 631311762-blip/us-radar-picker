name: 低位上影线模型每日流程

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30，周一至周五收盘后
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: low_shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: low_shadow
        run: pip install -r requirements.txt

      - name: 运行低位上影线模型
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: low_shadow/state
        working-directory: low_shadow
        run: |
          mkdir -p state
          python3 low_shadow_screener.py --mode review

      - name: 回写状态（供次日复盘）
        if: always()
        run: |
          git config user.name "lowshadow-bot"
          git config user.email "lowshadow-bot@users.noreply.github.com"
          git add low_shadow
          git commit -m "low_shadow state: $(date -u +%F)" || echo "无状态变更"
          git push || echo "推送状态失败（不影响选股）"
