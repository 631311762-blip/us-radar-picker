name: 美股异动双模型选股

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00，周一至周五盘前
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-radar-picker
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行三合一选股
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          mkdir -p state
          python us_radar_picker.py

      - name: 回写状态（供次日复盘）
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state
          git commit -m "state: $(date -u +%F)" || echo "无状态变更"
          git push || echo "推送状态失败（不影响选股）"
