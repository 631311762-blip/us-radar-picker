name: 高位上影线模型 独立流程

# =========================================================================
# 高位上影线模型 独立流程
# -------------------------------------------------------------------------
# 2026-11-13 新建接入骨架；2026-11-16 用户确认正式启用 + 微信推送。
#   - 平日主路径：统一流水线 a-share-pipeline.yml 通过 registry.json
#     (enabled=true) 调度，cmd 直接跑 high_shadow_screener.py，脚本内部
#     已接入 PushPlus 推送（读 PUSHPLUS_TOKEN）；
#   - 本文件保留为「自身代码」兜底路径（可手动触发 / 由 fallback-2300.yml
#     调用），带独立定时，确保主流水线故障时当天仍有名单与推送。
#
# 【重要】启用前须确认云盘原「高位上影线」独立定时已停掉，避免重复运行。
# =========================================================================

on:
  schedule:
    # UTC 08:30 = 北京 16:30（收盘后，晚于统一流水线 15:10 的 slot 作兜底）
    - cron: "30 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: high_shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查代码是否已迁移
        id: gate
        run: |
          if [ -f high_shadow/high_shadow_screener.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "接入代码已就位，开始运行高位上影线模型。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::高位上影线模型代码尚未迁移到 high_shadow/，本次跳过。"
            echo "接入契约见 high_shadow/README.md；迁移完成后本流程会自动生效。"
          fi

      - name: 安装依赖
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -f high_shadow/requirements.txt ]; then
            python3 -m pip install --quiet -r high_shadow/requirements.txt
          else
            python3 -m pip install --quiet requests numpy pandas
          fi

      - name: 共同前置层（交易日 + 立信 + ST + 全市场行情记录）
        if: steps.gate.outputs.ready == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          KLINE_BATCH_BUDGET: ${{ vars.KLINE_BATCH_BUDGET || '300' }}
          LIST_FETCH_DEADLINE: ${{ vars.LIST_FETCH_DEADLINE || '300' }}
        run: python3 common/prefilter.py

      - name: 运行高位上影线模型（自身代码路径 + 微信推送）
        if: steps.gate.outputs.ready == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UNIVERSE_JSON: common/state/universe.json
        run: python3 high_shadow/high_shadow_screener.py --mode review

      - name: 回写状态
        if: steps.gate.outputs.ready == 'true' && always()
        run: |
          git config user.name "high_shadow-bot"
          git config user.email "high_shadow-bot@users.noreply.github.com"
          git add high_shadow/state 2>/dev/null || true
          git add common/state/recommendations/high_shadow 2>/dev/null || true
          git commit -m "high_shadow state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
