name: 高位上影线模型 独立流程

# =========================================================================
# 高位上影线模型 独立流程
# -------------------------------------------------------------------------
# 2026-11-13 新建接入骨架；2026-11-16 用户确认正式启用 + 微信推送。
#   - 平日主路径：统一流水线 a-share-pipeline.yml 通过 registry.json
#     (enabled=true) 调度，cmd 直接跑 high_shadow_screener.py，脚本内部
#     已接入 PushPlus 推送（读 PUSHPLUS_TOKEN）；
#   - 本文件保留为「自身代码」兜底路径（手动触发 / 由 fallback-2300.yml
#     在主流水线失败时 dispatch），确保主流水线故障时当天仍有名单与推送。
#
# 2026-11-20 修正：移除原独立定时 cron（UTC 08:30=北京16:30）。它与统一流水线
#   并行推送，导致用户当天收到多条重复微信。兜底职责完全交给 fallback-2300，
#   本文件只保留 workflow_dispatch。另在脚本内加按天推送去重双重保险。
# =========================================================================

on:
  workflow_dispatch:
    inputs:
      push_only:
        description: "只补发指定日期台账的微信推送（跳过前置层与选股，秒级完成）"
        required: false
        default: "false"
      push_date:
        description: "配合 push_only 的台账日期 YYYY-MM-DD（默认当天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: high_shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查代码是否已迁移
        id: gate
        run: |
          if [ -f high_shadow/high_shadow_screener.py ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "接入代码已就位，开始运行高位上影线模型。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::高位上影线模型代码尚未迁移到 high_shadow/，本次跳过。"
            echo "接入契约见 high_shadow/README.md；迁移完成后本流程会自动生效。"
          fi

      - name: 安装依赖
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -f high_shadow/requirements.txt ]; then
            python3 -m pip install --quiet -r high_shadow/requirements.txt
          else
            python3 -m pip install --quiet requests numpy pandas
          fi

      - name: 补发模式（--push-only：只读台账秒级推送，跳过前置层/选股）
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.push_only == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSH_DATE: ${{ github.event.inputs.push_date }}
        run: |
          if [ -n "$PUSH_DATE" ]; then
            python3 high_shadow/high_shadow_screener.py --push-only --date "$PUSH_DATE"
          else
            python3 high_shadow/high_shadow_screener.py --push-only
          fi

      - name: 共同前置层（交易日 + 立信 + ST + 全市场行情记录）
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.push_only != 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          KLINE_BATCH_BUDGET: ${{ vars.KLINE_BATCH_BUDGET || '300' }}
          LIST_FETCH_DEADLINE: ${{ vars.LIST_FETCH_DEADLINE || '300' }}
        run: python3 common/prefilter.py

      - name: 运行高位上影线模型（自身代码路径 + 微信推送）
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.push_only != 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UNIVERSE_JSON: common/state/universe.json
        run: python3 high_shadow/high_shadow_screener.py --mode review

      - name: 回写状态
        if: steps.gate.outputs.ready == 'true' && github.event.inputs.push_only != 'true' && always()
        run: |
          git config user.name "high_shadow-bot"
          git config user.email "high_shadow-bot@users.noreply.github.com"
          git add high_shadow/state 2>/dev/null || true
          git add common/state/recommendations/high_shadow 2>/dev/null || true
          git commit -m "high_shadow state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
