name: 破位后上涨模型每日流程

# =========================================================================
# 2026-11-13 收敛说明（诊断报告第 4 项）
# -------------------------------------------------------------------------
# powei 已登记在 common/registry.json（enabled=true），由统一流水线
# a-share-pipeline.yml 在 cron(UTC 08:05 / 北京 16:05) 的同一个 runner 里，
# 用同一份前置层产物顺序执行。本文件原先还带独立 schedule(UTC 08:50) 与
# push 自动触发，会在另一个 runner 上**再跑一遍** common/prefilter.py 的全市场
# 抓取 —— Actions 的 job 之间不共享本地文件，所谓「读缓存」并不成立。
# 后果：重复烧 4000+ 只行情请求、与统一流水线叠加触发东财云 IP 限流，
# 也是 11-12 多次失败/取消的助推因素之一。
#
# 因此本次取消独立 schedule 与 push 自动触发，仅保留 workflow_dispatch
# 手动兜底（统一流水线挂掉时的紧急补跑）。取消定时后，powei 每天仍由
# 统一流水线自动跑一次，不会漏跑。
#
# 为什么手动兜底仍保留完整前置层：共享 K 线缓存 common/state/klines/ 被
# .gitignore 排除、不入库，跨 runner 不存在；若跳过前置层直接读 universe.json，
# powei/run.py 会对 4606 只逐只走 ctx.kline() 的网络回退，反而比跑一次
# 24 并发的前置层（实测约 300s 可全量缓存）慢得多。故不做「复用产物」式裁剪。
# =========================================================================

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: powei
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python3 -m pip install --quiet requests

      - name: 共同前置层（交易日 + 立信 + ST + 全市场行情记录）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          KZ_DATA_DIR: kaizhong/state
          KLINE_BATCH_BUDGET: ${{ vars.KLINE_BATCH_BUDGET || '300' }}
          LIST_FETCH_DEADLINE: ${{ vars.LIST_FETCH_DEADLINE || '300' }}
        run: python3 common/prefilter.py

      - name: 运行破位后上涨模型
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: powei/state
        working-directory: powei
        run: |
          mkdir -p state
          python3 run.py

      - name: 回写状态（供次日复盘 / 回溯）
        if: always()
        run: |
          git config user.name "powei-bot"
          git config user.email "powei-bot@users.noreply.github.com"
          git add powei/state
          git commit -m "powei state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
