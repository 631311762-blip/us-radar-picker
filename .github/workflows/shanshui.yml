name: 善水模型每日流程

# 2026-11-13（用户要求 2 / 3）：善水由统一流水线（北京 16:05）每日自动执行，
# 取消独立 schedule（原北京 16:10）。仅留 workflow_dispatch：手动调试 +
# 供 fallback-2300.yml 在主流水线当日失败时按自身代码兜底产出。

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shanshui
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 兜底路径无共享 K 线缓存，需自行抓取全市场，放宽预算
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # 2026-11-25：同 yidian.yml，善水已在 registry 停用，但旧版 watchdog 派发名单
      # 仍含本文件；以 registry.enabled 为唯一开关，避免误派发时照常抓数并推送。
      - name: 停用校验（registry.enabled=false 则跳过）
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          ms = [m for m in json.load(open('common/registry.json'))['models']
                if m['name'] == 'shanshui']
          print('run=%s' % ('false' if ms and not ms[0].get('enabled') else 'true'))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: shanshui
        run: pip install -r requirements.txt

      - name: 运行善水模型（自身代码路径）
        if: steps.guard.outputs.run == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: shanshui/state
          TZ: Asia/Shanghai
        working-directory: shanshui
        run: |
          mkdir -p state
          python3 daily_shanshui.py --model v10 --top 10

      - name: 回写状态（供次日复盘）
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "shanshui-bot"
          git config user.email "shanshui-bot@users.noreply.github.com"
          git add shanshui
          git commit -m "shanshui state: $(date -u +%F) [skip ci]" || echo "无状态变更"
          git pull --rebase origin main || true
          git push || echo "推送状态失败（不影响选股）"
