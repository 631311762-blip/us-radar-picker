name: 善水模型每日流程

on:
  schedule:
    # UTC 08:10 = 北京时间 16:10，周一至周五收盘后
    - cron: "10 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shanshui
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        working-directory: shanshui
        run: pip install -r requirements.txt

      - name: 运行善水模型
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STATE_DIR: shanshui/state
        working-directory: shanshui
        run: |
          mkdir -p state
          python3 daily_shanshui.py --model v10 --top 10

      - name: 回写状态（供次日复盘）
        if: always()
        run: |
          git config user.name "shanshui-bot"
          git config user.email "shanshui-bot@users.noreply.github.com"
          git add shanshui
          git commit -m "shanshui state: $(date -u +%F)" || echo "无状态变更"
          git push || echo "推送状态失败（不影响选股）"
